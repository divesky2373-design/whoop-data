[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whoop-agent"
version = "0.1.0"
description = "AI health agent that analyzes WHOOP data and generates weekly schedules"
requires-python = ">=3.10"
dependencies = [
    "whoopy>=0.3.0",
    "anthropic>=0.80.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "matplotlib>=3.7",
]

[project.scripts]
whoop-agent = "whoop_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
